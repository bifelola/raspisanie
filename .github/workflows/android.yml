name: Собрать Android-приложение

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write   # публикация APK в GitHub Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # нужна история и теги, чтобы собрать список изменений
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета KEYSTORE_BASE64 — без него обновления не встанут поверх старой версии"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/raspisanie.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/raspisanie.jks" >> "$GITHUB_ENV"
      - name: Сборка APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          gradle assembleRelease --no-daemon -PscheduleBaseUrl="https://${OWNER}.github.io/${REPO}/"
      - uses: actions/upload-artifact@v4
        with:
          name: raspisanie-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Опубликовать версию (GitHub Releases)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="1.0.${GITHUB_RUN_NUMBER}"
          cp android/app/build/outputs/apk/release/app-release.apk raspisanie.apk
          PREV=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV" ]; then
            git log "$PREV..HEAD" --no-merges --pretty='- %s' -- android > notes.txt
          fi
          [ -s notes.txt ] || git log -1 --pretty='- %s' > notes.txt
          gh release create "v$V" raspisanie.apk --title "Версия $V" --notes-file notes.txt --latest
          echo "VERSION=$V" >> "$GITHUB_ENV"
      - name: Пост в Telegram-канал
        if: github.ref == 'refs/heads/main'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          export SITE_URL="https://${OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
          export NOTES="$(cat notes.txt)"
          python3 .github/scripts/telegram_post.py
