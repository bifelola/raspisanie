name: Собрать Android-приложение

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Ключ подписи из секретов
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Нет секрета KEYSTORE_BASE64 — без него обновления не встанут поверх старой версии"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/raspisanie.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/raspisanie.jks" >> "$GITHUB_ENV"
      - name: Сборка APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          REPO="${GITHUB_REPOSITORY#*/}"
          gradle assembleRelease --no-daemon -PscheduleBaseUrl="https://${OWNER}.github.io/${REPO}/"
      - uses: actions/upload-artifact@v4
        with:
          name: raspisanie-apk
          path: android/app/build/outputs/apk/release/*.apk
