name: Обновить расписание

on:
  schedule:
    - cron: "15 3-17/2 * * *"   # каждые 2 часа с 6:15 до 20:15 по Москве
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "scraper/**", ".github/workflows/update.yml"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: Модели OCR (кэш)
        uses: actions/cache@v4
        with:
          path: ~/.EasyOCR
          key: easyocr-ru-en-v1

      - name: Зависимости
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r scraper/requirements.txt

      - name: Скачать и распознать новые PDF
        run: python -W ignore scraper/update.py

      - name: Сохранить архив в репозиторий
        run: |
          git config user.name "schedule-bot"
          git config user.email "schedule-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Расписание: обновление $(date -u +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
