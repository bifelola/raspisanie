<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Расписание МосОМК</title>
<meta name="description" content="Расписание занятий Мытищинского филиала МосОМК по группам, с архивом прошлых недель">
<meta name="theme-color" content="#1f5f8b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="groupBtn" class="group-btn" aria-haspopup="dialog">
    <span class="group-label">Группа</span>
    <span id="groupName" class="group-name">—</span>
  </button>
  <div class="week-nav">
    <button id="prevWeek" class="icon-btn" aria-label="Предыдущая неделя">‹</button>
    <div class="week-title">
      <div id="weekRange">…</div>
      <div id="weekNote" class="muted small"></div>
    </div>
    <button id="nextWeek" class="icon-btn" aria-label="Следующая неделя">›</button>
  </div>
  <nav id="dayTabs" class="day-tabs" aria-label="Дни недели"></nav>
  <button id="nowStrip" class="now-strip" hidden></button>
</header>

<main id="main">
  <div class="tools">
    <button id="openCollege" class="tool-btn">🔍 Преподаватели и кабинеты</button>
    <button id="openHistory" class="tool-btn">🕘 История изменений<span id="chgCount"></span></button>
  </div>
  <div id="status" class="status">Загрузка…</div>
  <div id="days"></div>
  <section id="scanBox" class="scan-box" hidden>
    <h2>Оригинал из PDF</h2>
    <p class="muted small">Расписание распознаётся автоматически со скана. Если что-то выглядит странно — сверьтесь с оригиналом. Нажмите на картинку, чтобы увеличить.</p>
    <div id="scans"></div>
  </section>
  <footer class="foot">
    <a class="link-btn" href="../">Главная · скачать приложение</a>
    <a class="link-btn" href="../privacy.html">Конфиденциальность</a>
    <button id="toggleScan" class="link-btn">Показать оригинал</button>
    <a id="pdfLink" class="link-btn" target="_blank" rel="noopener">PDF на сайте колледжа</a>
    <div id="updated" class="muted small"></div>
  </footer>
</main>

<dialog id="groupDialog" class="sheet">
  <form method="dialog" class="sheet-inner">
    <div class="sheet-head">
      <input id="groupSearch" type="search" placeholder="Поиск группы, например 22 фо" autocomplete="off">
      <button class="icon-btn" value="close" aria-label="Закрыть">✕</button>
    </div>
    <div id="groupList" class="group-list"></div>
  </form>
</dialog>

<dialog id="infoDialog" class="sheet">
  <form method="dialog" class="sheet-inner">
    <div class="sheet-head">
      <b id="infoTitle" class="sheet-title"></b>
      <button class="icon-btn" value="close" aria-label="Закрыть">✕</button>
    </div>
    <div id="infoBody" class="info-body"></div>
  </form>
</dialog>

<dialog id="collegeDialog" class="sheet big">
  <div class="sheet-inner">
    <div class="sheet-head">
      <button id="cBack" class="icon-btn" aria-label="Назад" hidden>‹</button>
      <div class="sheet-title"><b id="cTitle">Поиск по колледжу</b><div id="cSub" class="c-sub"></div></div>
      <button id="cFav" class="icon-btn fav" aria-label="Избранное" hidden>☆</button>
      <button id="cClose" class="icon-btn" aria-label="Закрыть">✕</button>
    </div>
    <div id="cTabs" class="c-tabs">
      <button data-tab="t">Где преподаватель?</button>
      <button data-tab="r">Свободные кабинеты</button>
    </div>
    <div id="cBody" class="info-body"></div>
  </div>
</dialog>

<script src="app.js"></script>
<script type="module">
import { initCookieBanner, countVisit } from "../common.js";
initCookieBanner((v) => { if (v === "all") countVisit(); });
countVisit();
</script>
</body>
</html>
